<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="#0A0A0A" stroke="#1A1A1A" stroke-width="2"/>
  
  <!-- Subtle glowing outline -->
  <polygon points="50,15 80,35 80,65 50,85 20,65 20,35" fill="none" stroke="url(#amberGrad)" stroke-width="3" filter="url(#glow)" opacity="0.6"/>
  
  <!-- 3D Isometric Amber Gemstone -->
  <!-- Top Right Face -->
  <polygon points="50,15 50,50 80,35" fill="url(#amberGrad)" opacity="0.9"/>
  <!-- Top Left Face -->
  <polygon points="50,15 20,35 50,50" fill="url(#amberGrad)" opacity="0.5"/>
  <!-- Bottom Right Face -->
  <polygon points="50,85 80,65 50,50" fill="url(#amberGrad)" opacity="0.7"/>
  <!-- Bottom Left Face -->
  <polygon points="50,85 50,50 20,65" fill="url(#amberGrad)" opacity="0.3"/>
  
  <!-- Central Highlight lines for sharpness -->
  <polyline points="20,35 50,50 80,35" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <line x1="50" y1="50" x2="50" y2="85" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="50" y1="15" x2="50" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
